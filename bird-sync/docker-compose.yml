services:
  bird-sync:
    build: .
    restart: unless-stopped
    environment:
      THUMBNAIL_SPECIES_CODES: "${THUMBNAIL_SPECIES_CODES}"
      THUMBNAIL_PUSH_URL: "${THUMBNAIL_PUSH_URL}"
      THUMBNAIL_PUSH_SECRET: "${THUMBNAIL_PUSH_SECRET}"
      THUMBNAIL_POLL_INTERVAL_MINUTES: "${THUMBNAIL_POLL_INTERVAL_MINUTES:-60}"
